[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semora"
version = "0.1.0"
description = "Reusable text processing, embedding, retrieval, and SQLite storage tools."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["embeddings", "semantic-search", "text-processing", "sqlite"]
authors = [
    { name = "Mitko Nikov", email = "mitko.nikov@um.si" },
    { name = "Anja Jodl", email = "anja.jodl@student.um.si" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
chunking = [
    "langchain-text-splitters>=0.2",
    "transformers>=4.41",
]
embeddings = [
    "FlagEmbedding>=1.2",
    "peft>=0.11",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.41",
]
openai-batch = [
    "requests>=2.31",
    "tiktoken>=0.7",
    "torch>=2.2",
]
projection = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "tqdm>=4.66",
    "umap-learn>=0.5",
]
retrieval = [
    "faiss-cpu>=1.8",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "tqdm>=4.66",
]
server = [
    "faiss-cpu>=1.8",
    "fastapi>=0.110",
    "numpy>=1.26",
    "pydantic>=2.6",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.41",
    "tqdm>=4.66",
    "uvicorn>=0.29",
]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
semora-project-embeddings = "semora.projection.projector:main"
semora-query = "semora.retrieval.search:main"
semora-serve = "semora.retrieval.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["semora*"]

[tool.setuptools.package-data]
semora = [
    "migrations/*.sql",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/semora"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
